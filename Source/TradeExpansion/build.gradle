plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven { url = "https://maven.isxander.dev/releases" } // YetAnotherConfigLib (config screen, design G)
	maven { url = "https://maven.terraformersmc.com/releases" } // Mod Menu
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"ak_trade_expansion" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional: Mod Menu's config button opens a YACL screen (design G, Q35). Not required at runtime.
	compileOnly "dev.isxander:yet-another-config-lib:${project.yacl_version}"
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	// Only the client source set uses them; declaring them there too lets the IDE (which scopes dependencies per
	// source set) resolve them in src/client.
	clientCompileOnly "dev.isxander:yet-another-config-lib:${project.yacl_version}"
	clientCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	localRuntime "dev.isxander:yet-another-config-lib:${project.yacl_version}"
	localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Unit tests for the Minecraft-independent core (com.akf.tradeexpansion.core).
	testImplementation platform("org.junit:junit-bom:5.12.2")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	// No annotation processors: Minecraft 26.3 is not obfuscated, so Mixin needs no refmap. Without this the IDE finds
	// Mixin's processor on the classpath and reports "Unable to locate obfuscation mapping".
	it.options.compilerArgs.add("-proc:none")
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// File names: the jar is ak_trade_expansion-<version>.jar, the same as the mod ID (C案, v0.28).
base {
	archivesName = "ak_trade_expansion"
}

// The license text lives at the repository root (../../LICENSE).
def licenseFile = rootProject.file("../../LICENSE")

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from(licenseFile) {
		rename { "${it}_$projectName"}
	}
}

// Distribution zip for mod sites (Crafters Colony etc.): the mod jar, the install guide (src/dist/README.txt with @VERSION@
// replaced) and the license: build/distributions/AKTradeExpansion-<version>.zip. Not part of "build"; made by
// release.bat (or "gradlew releaseZip").
def releaseZip = tasks.register("releaseZip", Zip) {
	group = "distribution"
	description = "Packs the mod jar, install guide and license for distribution."
	def version = project.version
	inputs.property "version", version
	archiveFileName = "AKTradeExpansion-${version}.zip"
	destinationDirectory = layout.buildDirectory.dir("distributions")
	from(tasks.named("jar"))
	from(licenseFile)
	from("src/dist") {
		filteringCharset = "UTF-8"
		// Plain token replacement (a Groovy template would treat the backslashes in Windows paths as escapes).
		filesMatching("README.txt") {
			filter { String line -> line.replace("@VERSION@", version.toString()) }
		}
	}
}


// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
